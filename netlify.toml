# Static site: TanStack Start prerenders every route to dist/client.
# Security headers (incl. CSP hashes) are generated into dist/client/_headers by scripts/postbuild.mjs.
[build]
  command = "pnpm build"
  publish = "dist/client"

[build.environment]
  NODE_VERSION = "24"
  # Override to preview deploys on another domain; canonical/OG/sitemap use this.
  VITE_SITE_URL = "https://zakat.bimaindra.com"
